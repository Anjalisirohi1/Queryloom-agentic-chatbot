services:
  postgres:
    image: postgres:16
    container_name: queryloom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: queryloom
      POSTGRES_PASSWORD: queryloom_dev_password
      POSTGRES_DB: queryloom
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryloom -d queryloom"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: